<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Banner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="banner">
        <!-- Main Frame with 4 Tiles -->
        <div id="main-frame">
            <div class="header">
                <div class="logo">KOHL'S</div>
            </div>
            <div class="headline">DISCOVER THE PERFECT GIFTS</div>
            <div class="check-container">
                <div class="check-box" id="green-check">
                    <div class="check-outline"></div>
                    <div class="check-mark">✓</div>
                </div>
                <div class="check-text">Check off your list with the best gifts.</div>
            </div>
            <div class="tiles-container">
                <div class="tile" id="tile1">
                    <img src="" alt="Shoes" class="tile-img">
                    <img src="" alt="Hoodies" class="tile-img-2">
                    <div class="tile-text">SHOES</div>
                </div>
                <div class="tile" id="tile2">
                    <img src="" alt="Chair" class="tile-img">
                    <img src="" alt="Hat" class="tile-img-2">
                    <div class="tile-text">CHAIR</div>
                </div>
                <div class="tile" id="tile3">
                    <img src="" alt="Ladies" class="tile-img">
                    <img src="" alt="Stocking" class="tile-img-2">
                    <div class="tile-text">LADIES</div>
                </div>
                <div class="tile" id="tile4">
                    <img src="" alt="Toaster" class="tile-img">
                    <img src="" alt="Pot" class="tile-img-2">
                    <div class="tile-text">TOASTER</div>
                </div>
            </div>
        </div>
        
        <!-- Carousel Frame -->
        <div id="carousel-frame">
            <div class="carousel-header">
                <div class="carousel-logo">KOHL'S</div>
                <div class="back-btn" id="back-btn">Back to Checklist</div>
            </div>
            <div class="carousel-headline">BEST GIFTS FOR EVERYONE</div>
            <div class="carousel-container">
                <div class="carousel-content" id="carousel-content">
                    <!-- Products will be loaded here -->
                </div>
                <div class="carousel-nav" id="carousel-nav">
                    <!-- Navigation dots will be created dynamically -->
                </div>
                <div class="carousel-arrows">
                    <div class="carousel-arrow" id="prev-arrow">◀</div>
                    <div class="carousel-arrow" id="next-arrow">▶</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
